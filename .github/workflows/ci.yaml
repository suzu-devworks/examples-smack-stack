name: CI

on:
  push:
    branches:
      - 'main'
    paths:
      - 'docker/**/*'
      - 'compose.yaml'
  pull_request:
    paths:
      - 'docker/**/*'
      - 'compose.yaml'
      - '.github/workflows/ci.yaml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install actions-lock extension
        run: gh extension install github/gh-actions-lock

      - name: Verify actions-lock
        run: gh actions-lock --verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  start:
    needs: verify-lock
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      docker: ${{ steps.changes.outputs.docker }}
      python: ${{ steps.changes.outputs.python }}

    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            docker:
              - 'compose.yaml'
              - 'docker/**/Dockerfile'
            python:
              - 'docker/**/*.py'
              - 'docker/**/*.ipynb'

  run-docker-check:
    needs: start
    if: needs.start.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Docker files changed."
      - uses: actions/checkout@v7

      - name: Docker compose config check
        run: docker compose config --quiet

      - name: Docker compose Dockerfile syntax check
        run: docker compose build --check

      - name: Docker compose build check
        run: docker compose build --no-cache

  run-python-check:
    needs: start
    if: needs.start.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Python files changed."
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: 'uv.lock'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: 'pyproject.toml'

      - name: Install dependencies
        run: uv sync --all-packages --all-extras

      - name: Lint with ruff
        uses: astral-sh/ruff-action@v4.1.0
        with:
          src: ./docker
