services:
  cassandra:
    image: cassandra:latest
    container_name: cassandra
    networks:
      - interconnect
    ports:
      - '9042:9042'
    environment:
      - CASSANDRA_CLUSTER_NAME=TestCluster
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=100M
    healthcheck:
      test: [ 'CMD', 'cqlsh', '-e', 'describe cluster' ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  spark:
    image: spark:3.5.9-python3
    container_name: spark
    networks:
      - interconnect
    command: tail -f /dev/null # ← コンテナを常駐させるために必要
    ports:
      - '8080:8080'
      - '4040:4040'
    environment:
      - SPARK_DRIVER_MEMORY=512m
      - SPARK_EXECUTOR_MEMORY=512m
    depends_on:
      cassandra:
        condition: service_healthy

networks:
  interconnect:
    driver: bridge
