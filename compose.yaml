services:
  cassandra:
    image: cassandra:latest
    container_name: cassandra
    networks:
      - interconnect
    ports:
      - '9042:9042'
    environment:
      - CASSANDRA_CLUSTER_NAME=TestCluster
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=100M
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: [ 'CMD', 'cqlsh', '-e', 'describe cluster' ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G # コンテナ全体の上限も1GBにロック

  spark:
    image: spark:3.5.9-python3
    container_name: spark
    networks:
      - interconnect
    command: tail -f /dev/null # ← コンテナを常駐させるために必要
    ports:
      - '8080:8080'
      - '4040:4040'
    environment:
      - SPARK_DRIVER_MEMORY=512m
      - SPARK_EXECUTOR_MEMORY=512m
    depends_on:
      cassandra:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    networks:
      - interconnect
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # 内部通信用(INTERNAL)と外部通信用(EXTERNAL)の2つの口を用意
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      # KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms256M"
      # シングルノード（1台構成）必須設定（デフォルト3台構成
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    deploy:
      resources:
        limits:
          memory: 800M

volumes:
  cassandra-data:

networks:
  interconnect:
    name: examples-smack-bridge
    driver: bridge
